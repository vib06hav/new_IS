name: Backend

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres_password
          POSTGRES_DB: ag_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d ag_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql+psycopg2://postgres:postgres_password@localhost:5432/ag_test
      DB_POOL_SIZE: "5"
      DB_MAX_OVERFLOW: "10"
      JWT_SECRET: test-jwt-secret-with-adequate-entropy-1234567890
      JWT_ALGORITHM: HS256
      JWT_ACCESS_TOKEN_EXPIRE_MINUTES: "60"
      SESSION_COOKIE_NAME: agis_session
      SESSION_COOKIE_SAMESITE: lax
      CSRF_COOKIE_NAME: agis_csrf
      CSRF_HEADER_NAME: X-CSRF-Token
      CSRF_TRUSTED_ORIGINS: http://testserver
      CORS_ALLOWED_ORIGINS: http://testserver
      FRONTEND_ORIGIN: http://testserver
      TRUSTED_HOSTS: testserver,localhost,127.0.0.1
      ENABLE_BEARER_TOKEN_AUTH: "true"
      LLM_PROVIDER: aicredits
      AICREDITS_BASE_URL: https://api.aicredits.in/v1
      LLM_ENDPOINT: https://api.aicredits.in/v1/chat/completions
      LLM_MODEL_NAME: openai/gpt-4o-mini
      LLM_API_KEY: test-llm-key
      LLM_TIMEOUT_SECONDS: "60"
      LLM_TEMPERATURE: "0.0"
      LLM_JSON_MODE: "true"
      LLM_PAYLOAD_MODE: full
      LLM_DISABLE_LIVE_CALLS: "true"
      AICREDITS_GENERATION_API_KEY: test-generation-key
      AICREDITS_GENERATION_MODEL_PRIMARY: openai/gpt-4o-mini
      AICREDITS_GENERATION_MODEL_FALLBACK: openai/gpt-4.1-mini
      AICREDITS_REPORT_CHAT_API_KEY: test-report-chat-key
      AICREDITS_REPORT_CHAT_MODEL_PRIMARY: openai/gpt-4o-mini
      AICREDITS_REPORT_CHAT_MODEL_FALLBACK: openai/gpt-4.1-mini
      AICREDITS_INTERVIEW_REFINEMENT_API_KEY: test-refinement-key
      AICREDITS_INTERVIEW_REFINEMENT_MODEL_PRIMARY: openai/gpt-4o-mini
      AICREDITS_INTERVIEW_REFINEMENT_MODEL_FALLBACK: openai/gpt-4.1-mini
      AICREDITS_QUESTION_REGEN_API_KEY: test-question-regen-key
      AICREDITS_QUESTION_REGEN_MODEL_PRIMARY: openai/gpt-4o-mini
      AICREDITS_QUESTION_REGEN_MODEL_FALLBACK: openai/gpt-4.1-mini
      UPLOAD_DIRECTORY: /tmp/agis-uploads
      STORAGE_BACKEND: local
      MAX_UPLOAD_SIZE_MB: "10"
      MAX_PROFILE_IMAGE_SIZE_MB: "5"
      REDIS_URL: ""
      APP_ENV: development
      LOG_LEVEL: INFO
      DEV_BOOTSTRAP_ADMIN: "false"
      WORKOS_API_KEY: sk_test_workos
      WORKOS_CLIENT_ID: client_test_workos
      WORKOS_COOKIE_PASSWORD: test-workos-cookie-password-1234567890
      WORKOS_REDIRECT_URI: http://testserver/auth/callback
      WORKOS_LOGOUT_REDIRECT_URI: http://testserver/
      FOUNDER_ADMIN_EMAIL: founder@example.com
      PARSER_ENGINE_VERSION: v2

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Run migrations
        run: alembic upgrade head

      - name: Run tests
        run: pytest -q
